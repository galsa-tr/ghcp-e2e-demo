name: Poll Jira for New Bugs

on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Query Jira and create GitHub issues
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          JIRA_BASE_URL: https://etoro.atlassian.net
          GITHUB_REPO: galsa-tr/ghcp-e2e-demo
        run: |
          set -euo pipefail

          JQL='reporter = "Connector for Salesforce & Jira" AND issuetype = Bug AND priority in (P2,P3,P4) AND labels != "sent-to-github" AND status not in (Done,Closed,Resolved) ORDER BY created ASC'

          echo "Querying Jira..."
          RESPONSE=$(curl -s -G "$JIRA_BASE_URL/rest/api/3/search" \
            --data-urlencode "jql=$JQL" \
            --data-urlencode "fields=summary,description,priority,status,reporter,comment,environment" \
            --data-urlencode "maxResults=20" \
            -H "Authorization: Bearer $JIRA_TOKEN" \
            -H "Accept: application/json")

          TOTAL=$(echo "$RESPONSE" | jq '.total // 0')
          echo "Found $TOTAL new bugs"

          if [ "$TOTAL" -eq 0 ]; then
            echo "No new bugs. Exiting."
            exit 0
          fi

          echo "$RESPONSE" | jq -c '.issues[]' | while read -r ISSUE; do
            KEY=$(echo "$ISSUE" | jq -r '.key')
            SUMMARY=$(echo "$ISSUE" | jq -r '.fields.summary')
            PRIORITY=$(echo "$ISSUE" | jq -r '.fields.priority.name')
            REPORTER=$(echo "$ISSUE" | jq -r '.fields.reporter.displayName')
            STATUS=$(echo "$ISSUE" | jq -r '.fields.status.name')
            DESCRIPTION=$(echo "$ISSUE" | jq -r '.fields.description // "No description provided"')

            echo "Processing $KEY: $SUMMARY"

            BODY="## Jira Ticket
          **Key**: [$KEY]($JIRA_BASE_URL/browse/$KEY)
          **Priority**: $PRIORITY
          **Reporter**: $REPORTER
          **Status**: $STATUS
          **Environment**: https://testenv-main.front.stg.etoro.com/

          ## Description
          $DESCRIPTION"

            GH_RESPONSE=$(curl -s -X POST "https://api.github.com/repos/$GITHUB_REPO/issues" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$(jq -n \
                --arg title "[$PRIORITY] $KEY: $SUMMARY" \
                --arg body "$BODY" \
                '{title: $title, body: $body, labels: ["needs-verification"]}')")

            GH_ISSUE_URL=$(echo "$GH_RESPONSE" | jq -r '.html_url')
            GH_ISSUE_NUMBER=$(echo "$GH_RESPONSE" | jq -r '.number')
            echo "Created GitHub issue #$GH_ISSUE_NUMBER: $GH_ISSUE_URL"

            # Stamp Jira ticket with sent-to-github label
            curl -s -X PUT "$JIRA_BASE_URL/rest/api/3/issue/$KEY" \
              -H "Authorization: Bearer $JIRA_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"update": {"labels": [{"add": "sent-to-github"}]}}' > /dev/null

            # Add comment to Jira ticket
            curl -s -X POST "$JIRA_BASE_URL/rest/api/3/issue/$KEY/comment" \
              -H "Authorization: Bearer $JIRA_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg url "$GH_ISSUE_URL" \
                '{body: {type: "doc", version: 1, content: [{type: "paragraph", content: [{type: "text", text: ("GitHub issue created: " + $url + ". Automated verification flow triggered.")}]}]}}')" > /dev/null

            echo "Stamped $KEY with sent-to-github label and added comment"
          done
